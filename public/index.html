<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>泡面小铺</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 营业状态横幅 -->
    <div id="banner" class="banner"></div>

    <!-- 商品列表 -->
    <div id="productList" class="product-list"></div>

    <div class="cart-holder"></div>

    <!-- 底部购物车栏 -->
    <div class="cart-bar">
      <div class="cart-info">
        <div class="cart-count" id="cartCount">已选 0 件</div>
        <div class="cart-total">合计 <span class="cart-total-num" id="cartTotal">¥0.00</span></div>
      </div>
      <div class="cart-submit" id="cartSubmit">请选择商品</div>
    </div>

    <!-- 确认订单弹层 -->
    <div class="modal-mask" id="checkoutModal">
      <div class="modal">
        <div class="modal-title">确认订单</div>
        <div class="closed-tip" id="closedTip" style="display:none">⚠️ 当前不营业，可先预选商品，营业后再提交</div>
        <div class="modal-items" id="modalItems"></div>
        <div class="modal-total">合计 <span id="modalTotal"></span></div>
        <input class="dorm-input" id="dormInput" placeholder="填写寝室号，例如：3栋506" maxlength="30">
        <div class="modal-btns">
          <div class="btn-cancel" id="cancelBtn">取消</div>
          <div class="btn-submit" id="submitBtn">提交订单</div>
        </div>
      </div>
    </div>

    <!-- 支付弹层（扫码付款） -->
    <div class="modal-mask" id="payModal">
      <div class="modal modal-center">
        <div class="modal-title">请扫码支付</div>
        <div class="pay-amount">¥<span id="payAmount">0.00</span></div>
        <div class="pay-tip">用微信扫一扫下方收款码付款</div>
        <img class="pay-qr" id="payQr" src="images/shoukuan.jpg" alt="微信收款码" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div class="pay-qr-missing" style="display:none">收款码还没放：请把微信收款码图片保存为 public/images/shoukuan.jpg</div>
        <div class="success-sub">付款完成后请留意寝室门口</div>
        <div class="btn-submit" id="payOkBtn">我已支付</div>
      </div>
    </div>
  </div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
